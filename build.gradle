plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.1'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.turnquest'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
    set('springCloudVersion', "2023.0.2")
    set('springBootVersion', "3.3.1")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'com.oracle.database.jdbc:ojdbc8:19.6.0.0'
	implementation 'com.oracle.database.jdbc:ucp:19.6.0.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.4.0'
	implementation 'org.apache.directory.studio:org.apache.commons.io:2.4'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
//    testImplementation 'org.springframework.security:spring-security-test'
	// https://mvnrepository.com/artifact/org.junit.platform/junit-platform-launcher
	testImplementation 'org.junit.platform:junit-platform-launcher:1.11.0-M2'


//    implementation 'org.springframework.cloud:spring-cloud-starter'
//	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
}

//dependencyManagement {
//    imports {
//        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
//		mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
//    }
//}

tasks.named('test') {
	useJUnitPlatform()
}
